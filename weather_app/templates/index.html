<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>El Niño Tracker – live Pacific sea temperatures</title>
  <meta name="description" content="Live El Niño tracker: Pacific sea surface temperature anomalies, the Niño regions and NOAA's ENSO status on a live satellite globe.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div id="map" aria-label="El Niño map"></div>
  <div id="globe" aria-label="3D globe" hidden></div>

  <!-- Title -->
  <div class="panel brand-panel">
    <div class="brand">🌊 <span>El Niño Tracker</span></div>
    <div class="brand-sub">Pacific sea temperatures vs normal, live</div>
  </div>

  <!-- El Niño status -->
  <aside class="panel enso-panel" id="enso-panel" aria-live="polite">
    <div id="enso-content"><div class="enso-headline">Loading El Niño data…</div></div>
  </aside>

  <!-- View switcher -->
  <nav class="panel layer-panel" aria-label="View">
    <button class="toggle-btn view-btn" id="globe-toggle" title="3D globe"><span>🌐</span>Globe</button>
    <button class="toggle-btn view-btn" id="map-toggle" title="Flat map"><span>🗺️</span>Map</button>
    <hr>
    <button class="toggle-btn active" id="sst-toggle" title="Sea surface temperature anomaly map"><span>🌡️</span>Sea temp</button>
  </nav>

  <!-- Imagery -->
  <div class="panel sat-panel" id="sat-panel">
    <label for="sat-source">Imagery</label>
    <select id="sat-source">
      <option value="esri">High‑res imagery</option>
      <option value="viirs">NASA VIIRS (daily)</option>
      <option value="modis">NASA MODIS (daily)</option>
      <option value="dark">Dark map</option>
    </select>
    <input id="sat-date" type="date" aria-label="Imagery date" hidden>
    <label for="live-style">Live</label>
    <select id="live-style" title="Real-time imagery from 5 geostationary satellites">
      <option value="truecolor">True colour</option>
      <option value="infrared">Infrared clouds</option>
      <option value="off">Off</option>
    </select>
    <label class="switch" title="Show where it is day and night right now">
      <input id="night-toggle" type="checkbox" checked> Day/night
    </label>
    <span id="clouds-time" class="clouds-time"></span>
    <button id="sources-btn" class="link-btn" type="button">Sources</button>
  </div>

  <!-- Data sources -->
  <aside class="panel sources-panel" id="sources-panel" hidden aria-label="Data sources">
    <button class="close-btn" id="sources-close" aria-label="Close">✕</button>
    <div id="sources-content"></div>
  </aside>

  <!-- Legend -->
  <div class="panel legend" id="legend" hidden>
    <div class="legend-title">Sea surface temperature vs normal (°C)</div>
    <div class="legend-bar sst-gradient"></div>
    <div class="legend-labels"><span>−3</span><span>−2</span><span>−1</span><span>0</span><span>+1</span><span>+2</span><span>+3</span></div>
  </div>

  <div id="loading" class="loading" hidden><div class="spinner"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>window.APP_CONFIG = {{ app_config | tojson }};</script>
  {% if app_config.static %}<script src="{{ url_for('static', filename='js/static-api.js') }}"></script>{% endif %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
