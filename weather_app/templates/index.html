<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{ meta.title }}</title>
  <meta name="description" content="{{ meta.description }}">
  <meta name="keywords" content="{{ meta.keywords }}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="{{ meta.url }}">
  <meta name="theme-color" content="{{ meta.theme_color }}">
  {% if meta.google_verification %}<meta name="google-site-verification" content="{{ meta.google_verification }}">{% endif %}
  {% if meta.bing_verification %}<meta name="msvalidate.01" content="{{ meta.bing_verification }}">{% endif %}

  <!-- Sharing previews (Facebook, WhatsApp, LinkedIn, X) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ meta.site_name }}">
  <meta property="og:title" content="{{ meta.title }}">
  <meta property="og:description" content="{{ meta.description }}">
  <meta property="og:url" content="{{ meta.url }}">
  <meta property="og:image" content="{{ meta.image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Live weather globe with satellite clouds and forecast maps">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ meta.title }}">
  <meta name="twitter:description" content="{{ meta.description }}">
  <meta name="twitter:image" content="{{ meta.image }}">

  <!-- Icons and installable app -->
  <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='img/favicon-48.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Connect early to the map and data servers -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://server.arcgisonline.com">
  <link rel="preconnect" href="https://gibs.earthdata.nasa.gov">
  <link rel="preconnect" href="https://view.eumetsat.int">
  <link rel="preconnect" href="https://tilecache.rainviewer.com">

  <script type="application/ld+json">{{ json_ld | safe }}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/globe.css') }}">
</head>
<body class="globe-page">
  <div id="wx-globe" aria-label="Weather globe"></div>

  <!-- For search engines and screen readers; the globe is the visual content. -->
  <div class="sr-only">
    <h1>Live weather globe: satellite, radar and forecast maps</h1>
    <p>{{ meta.description }}</p>
  </div>

  <!-- Brand + site menu -->
  <header class="wx-brand panel">
    <a href="./" class="wx-logo" aria-label="El Niño Tracker home">🌊 <b>El Niño</b> Tracker</a>
    <form class="wx-searchbox" id="wx-search-form" role="search">
      <input type="search" id="wx-search" placeholder="Search a village or city" aria-label="Search a place" autocomplete="off">
      <ul class="wx-results" id="wx-results" hidden></ul>
    </form>
    <nav class="wx-site" aria-label="Site">
      <a href="el-nino/">El Niño</a><a href="news/">News</a><a href="crops/">Crops</a>
    </nav>
  </header>

  <!-- Left: which map -->
  <aside class="wx-panel wx-maps panel" id="wx-maps" aria-label="Maps">
    <button class="wx-panel-head" data-collapse="wx-maps" aria-expanded="true">Live maps <span aria-hidden="true">⌃</span></button>
    <div class="wx-panel-body">
      <button class="wx-item" data-map="satellite"><span>🛰️</span>Satellite</button>
      <div class="wx-sub" id="wx-sat-styles">
        <button class="wx-subitem" data-style="truecolor">True colour</button>
        <button class="wx-subitem" data-style="infrared">Infrared</button>
      </div>
      <button class="wx-item" data-map="radar"><span>📡</span>Radar</button>
      <div class="wx-sub" id="wx-radar-opts" hidden>
        <button class="wx-subitem" id="wx-rv-clouds" type="button">☁️ Clouds</button>
      </div>
      <p class="wx-group">Forecast maps</p>
      <button class="wx-item" data-map="rain"><span>🌧️</span>Precipitation</button>
      <button class="wx-item" data-map="wind"><span>💨</span>Wind</button>
      <button class="wx-item" data-map="temp"><span>🌡️</span>Temperature</button>
      <button class="wx-item" data-map="humidity"><span>💧</span>Humidity</button>
      <button class="wx-item" data-map="pressure"><span>🧭</span>Pressure</button>
      <p class="wx-group">Ocean</p>
      <button class="wx-item" data-map="sst"><span>🌊</span>Sea temperature (El Niño)</button>
    </div>
  </aside>

  <!-- Right: overlays -->
  <aside class="wx-panel wx-overlays panel" id="wx-overlays" aria-label="Map overlays">
    <button class="wx-panel-head" data-collapse="wx-overlays" aria-expanded="true">Map overlays <span aria-hidden="true">⌃</span></button>
    <div class="wx-panel-body">
      <button class="wx-item" data-overlay="windanim"><span>〰️</span>Wind animation</button>
      <button class="wx-item" data-overlay="temps"><span>🌡️</span>Temperatures</button>
      <button class="wx-item" data-overlay="labels"><span>🏷️</span>Labels</button>
      <button class="wx-item" data-overlay="borders"><span>🗺️</span>Border lines</button>
      <button class="wx-item" data-overlay="night"><span>🌗</span>Night boundary</button>
      <button class="wx-item" data-overlay="grid"><span>#️⃣</span>Coordinate grid</button>
      <button class="wx-item" data-overlay="nino"><span>🟥</span>El Niño regions</button>
    </div>
  </aside>

  <!-- Phone buttons that open the two panels -->
  <div class="wx-mobile-bar">
    <button class="wx-fab" data-open="wx-maps" aria-label="Choose map">🗺️ <span id="wx-map-name">Satellite</span></button>
    <button class="wx-fab" data-open="wx-overlays" aria-label="Map overlays">⚙️</button>
  </div>

  <!-- Bottom: legend + time -->
  <div class="wx-legend panel" id="wx-legend" hidden></div>
  <div class="wx-time panel" id="wx-time" role="group" aria-label="Time">
    <button class="wx-play" id="wx-play" aria-label="Play">▶</button>
    <button class="wx-step" id="wx-prev" aria-label="Earlier">‹</button>
    <div class="wx-when"><b id="wx-when">Loading…</b><small id="wx-when-sub"></small></div>
    <button class="wx-step" id="wx-next" aria-label="Later">›</button>
    <button class="wx-live" id="wx-live">Live</button>
    <input type="range" id="wx-slider" min="0" max="0" value="0" aria-label="Time">
    <div class="wx-range" id="wx-range" aria-live="polite"></div>
  </div>
  <div class="wx-status" id="wx-status" hidden></div>

  <script>window.APP_CONFIG = {{ app_config | tojson }};</script>
  <script src="{{ url_for('static', filename='js/nowcast.js') }}"></script>
  <script src="{{ url_for('static', filename='js/globe.js') }}"></script>
</body>
</html>
