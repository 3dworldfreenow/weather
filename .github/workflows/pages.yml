name: Deploy demo to GitHub Pages

on:
  push:
    branches: ["**"]
  schedule:
    # Refresh El Niño data, satellite catalogue and events every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/build_static.py dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Publish from the default branch only. Scheduled and manual runs always
    # use the default branch (their event payload has no repository info).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
